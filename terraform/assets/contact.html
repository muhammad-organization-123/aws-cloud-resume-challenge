<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d13">
  <meta name="description" content="Contact Muhammad Khan about AWS, DevOps, and cloud engineering opportunities.">
  <title>Contact | Muhammad Khan</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #0b0d13;
      --panel: #171a2a;
      --ink: #e8ecf4;
      --copy: #a8b3ca;
      --muted: #7c88a2;
      --line: #2b3048;
      --mint: #5ce8c5;
      --coral: #ff9c79;
      --serif: Georgia, "Times New Roman", serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      background: linear-gradient(135deg, #0b0d13, #10131b 52%, #0b0d13);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
    }

    a { color: inherit; }

    .shell { width: min(1120px, calc(100% - 64px)); margin-inline: auto; }

    .topbar {
      display: flex;
      min-height: 76px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--line);
    }

    .identity {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .monogram {
      display: grid;
      width: 38px;
      aspect-ratio: 1;
      place-items: center;
      background: #173b36;
      color: var(--mint);
      font-family: var(--serif);
      font-size: 17px;
    }

    .topbar nav { display: flex; align-items: center; gap: 30px; }

    .topbar nav a {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
    }

    .topbar nav a:hover, .topbar nav a:focus-visible, .topbar nav a[aria-current="page"] { color: var(--mint); }

    .visitor { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; white-space: nowrap; }

    .visitor-dot { width: 7px; aspect-ratio: 1; border-radius: 50%; background: #69a97c; }

    main { flex: 1; }

    .contact-section { padding-block: 48px 72px; }

    .section-heading { display: flex; align-items: center; gap: 18px; }

    .section-heading h1 {
      margin: 0;
      color: var(--mint);
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .section-heading::after { height: 1px; flex: 1; background: var(--line); content: ""; }

    .contact-list { display: grid; max-width: 720px; gap: 15px; margin-top: 32px; }

    .contact-card {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
      text-decoration: none;
      transition: border-color 160ms ease, transform 160ms ease;
    }

    .contact-card:hover, .contact-card:focus-visible { border-color: var(--mint); transform: translateY(-2px); }

    .contact-icon { display: grid; width: 44px; aspect-ratio: 1; place-items: center; color: var(--mint); }

    .contact-icon svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }

    .contact-label { display: block; color: var(--muted); font-family: var(--mono); font-size: 11px; text-transform: uppercase; }

    .contact-value { display: block; overflow-wrap: anywhere; color: var(--ink); font-size: 17px; font-weight: 600; }

    .contact-hint { display: block; margin-top: 3px; color: var(--copy); font-size: 13px; }

    .footer { background: #08090e; border-top: 1px solid #252a3a; color: #75819a; }

    .footer-inner {
      display: flex;
      min-height: 92px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      font-family: var(--mono);
      font-size: 14px;
    }

    .footer-links { display: flex; align-items: center; gap: 28px; }

    .footer a { display: inline-flex; align-items: center; gap: 9px; color: inherit; text-decoration: none; }

    .footer a:hover, .footer a:focus-visible { color: var(--mint); }

    .footer svg { width: 19px; height: 19px; fill: currentColor; }

    .footer p { margin: 0; }

    @media (max-width: 760px) {
      .shell { width: min(100% - 40px, 560px); }
      .topbar { min-height: 68px; flex-wrap: wrap; padding-block: 12px; }
      .topbar nav { order: 3; width: 100%; justify-content: space-between; gap: 12px; }
      .visitor { margin-left: auto; }
      .contact-section { padding-block: 38px 54px; }
      .footer-inner { min-height: 84px; align-items: flex-start; flex-direction: column; justify-content: center; gap: 10px; padding-block: 16px; }
      .footer-links { gap: 20px; }
    }

    @media (max-width: 420px) {
      .shell { width: calc(100% - 32px); }
      .identity { font-size: 12px; }
      .contact-card { grid-template-columns: 38px minmax(0, 1fr); gap: 12px; padding: 16px 14px; }
      .contact-icon { width: 36px; }
      .contact-value { font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar shell">
    <a class="identity" href="/index.html#top" aria-label="Muhammad Khan, home">
      <span class="monogram" aria-hidden="true">MK</span>
      <span>Muhammad Khan</span>
    </a>
    <nav aria-label="Main navigation">
      <a href="/index.html#experience">Experience</a>

  </main>

      <p>&copy; 2026 Muhammad Khan</p>

  <script>
    fetch("${api_url}")
      .then(response => response.json())
      .then(data => {
        document.getElementById("visitor-count").textContent = data.count;
      })
      .catch(() => {
        document.getElementById("visitor-count").textContent = "Unavailable";
      });
  </script>
</body>
</html>
