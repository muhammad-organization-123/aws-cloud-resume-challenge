name: Deploy website

'on':
  push:
    branches: [main]
    paths:
      - 'terraform/assets/**'
      - 'terraform/outputs.tf'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  deploy:
    name: Deploy website to S3
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::458479371105:role/GitHubAction-AssumeRoleWithAction
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Read website settings from Terraform outputs
        id: website
        working-directory: terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform init -input=false -no-color
          {
            echo "s3_bucket=$(terraform output -raw S3_BUCKET)"
            echo "cloudfront_distribution_id=$(terraform output -raw CLOUDFRONT_DISTRIBUTION_ID)"
            echo "visitor_api_url=$(terraform output -raw api_url)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload website and refresh CloudFront
        env:
          S3_BUCKET: ${{ steps.website.outputs.s3_bucket }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ steps.website.outputs.cloudfront_distribution_id }}
          VISITOR_API_URL: ${{ steps.website.outputs.visitor_api_url }}
        shell: bash
        run: |
          set -euo pipefail
          : "${S3_BUCKET:?Terraform output S3_BUCKET is empty}"
          : "${CLOUDFRONT_DISTRIBUTION_ID:?Terraform output CLOUDFRONT_DISTRIBUTION_ID is empty}"
          : "${VISITOR_API_URL:?Terraform output api_url is empty}"

          site_dir="$RUNNER_TEMP/website"
          mkdir -p "$site_dir"
          cp -R terraform/assets/. "$site_dir/"

          for page in index.html skills.html contact.html; do
            sed "s|\${api_url}|${VISITOR_API_URL}|g" "$site_dir/$page" > "$site_dir/$page.tmp"
            mv "$site_dir/$page.tmp" "$site_dir/$page"
          done

          aws s3 sync "$site_dir/" "s3://${S3_BUCKET}/" --delete --region "$AWS_REGION"
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
